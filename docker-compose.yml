version: '3.8'

services:
  # 1. The AdverTest CLI Environment
  advertest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advertest-cli
    volumes:
      # Mount local data and weights directories so the container can process them
      - ./data:/app/data
      - ./weights:/app/weights
      # Mount the codebase so developers can edit code without rebuilding the image
      - ./advertest:/app/advertest
      - ./main.py:/app/main.py
    environment:
      - LABEL_STUDIO_URL=http://label-studio:8080
      # Change this API key if you configure a custom one in Label Studio
      - LABEL_STUDIO_API_KEY=YOUR_LABEL_STUDIO_TOKEN_HERE
      - WANDB_API_KEY=${WANDB_API_KEY:-""}
      - PYTHONUNBUFFERED=1
    # Run a tail command to keep the container alive for interactive CLI usage
    # Usage: docker-compose exec advertest python main.py --help
    command: tail -f /dev/null
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - label-studio

  # 2. Local Label Studio (Offline HITL Workflow)
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: advertest-label-studio
    ports:
      - "8080:8080"
    volumes:
      # Persist Label Studio SQLite DB and configurations
      - ./data/label_studio_data:/label-studio/data
      # Mount the local data dir so Label Studio Local Storage can serve the images
      - ./data:/data
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/data
