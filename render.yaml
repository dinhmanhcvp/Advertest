# Render Blueprint Configuration for AdverTest Platform
services:
  - type: web
    name: advertest-api
    env: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/v1/insights
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: advertest-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://c4-app-advertest-arqt.onrender.com,https://c4-app-195-advertest.is-pro.dev,http://localhost:3000

  - type: web
    name: advertest-frontend
    runtime: node
    region: singapore
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: advertest-api
          property: host

databases:
  - name: advertest-db
    plan: starter
    region: singapore
    postgresMajorVersion: "15"
