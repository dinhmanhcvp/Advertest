# Render Blueprint Configuration for AdverTest Platform
services:
  - type: web
    name: advertest-api
    env: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/v1/insights
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: advertest-db
          property: connectionString
      - key: CORS_ORIGINS
        # Vercel will generate a URL later, you can add it here or in the Render Dashboard
        value: https://c4-app-advertest-arqt.onrender.com,https://c4-app-195-advertest.is-pro.dev,http://localhost:3000

databases:
  - name: advertest-db
    plan: starter
    region: singapore
    postgresMajorVersion: "15"
